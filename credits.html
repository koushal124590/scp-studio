<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Credits - SCP Studio</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .header-nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .header-nav a {
            color: #0EA5E9;
            text-decoration: none;
            font-size: 14px;
        }
        .header-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="page-container" style="flex-direction: column;">
    
    <div class="header-nav">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Editor</a>
    </div>

    <div class="credits-header">
        <h1 style="margin-bottom: 5px;">Your Balance</h1>
        <div class="credit-balance" id="balanceDisplay"><i class="fa-solid fa-coins"></i> 0</div>
        <p style="color: #a0a0a0; margin-top: 5px;">Need more credits for generations? Buy a pack below.</p>
    </div>

    <div class="credits-grid">
        <div class="credit-pack" onclick="buyCredits(100)">
            <h4>Starter Pack</h4>
            <div>100 Credits</div>
            <div class="pack-price">$4.99</div>
        </div>
        <div class="credit-pack" onclick="buyCredits(500)" style="border-color: #0EA5E9;">
            <h4 style="color: #0EA5E9;">Pro Pack</h4>
            <div>500 Credits</div>
            <div class="pack-price">$19.99</div>
        </div>
        <div class="credit-pack" onclick="buyCredits(2000)">
            <h4>Studio Pack</h4>
            <div>2000 Credits</div>
            <div class="pack-price">$49.99</div>
        </div>
    </div>

    <script>
        function updateBalanceUI() {
            let userStr = localStorage.getItem('vectorizerUser');
            let balance = 0;
            if (userStr) {
                let user = JSON.parse(userStr);
                balance = user.credits || 0;
            }
            document.getElementById('balanceDisplay').innerHTML = `<i class="fa-solid fa-coins"></i> ${balance}`;
        }

        function buyCredits(amount) {
            let userStr = localStorage.getItem('vectorizerUser');
            if (userStr) {
                let user = JSON.parse(userStr);
                user.credits = (user.credits || 0) + amount;
                localStorage.setItem('vectorizerUser', JSON.stringify(user));
                alert(`Successfully purchased ${amount} credits!`);
                updateBalanceUI();
            } else {
                window.location.href = 'login.html';
            }
        }

        // Initialize UI
        updateBalanceUI();
    </script>
</body>
</html>
