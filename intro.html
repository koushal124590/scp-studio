<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP - Secret Corporation Protocols // Cinematic Keynote Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .intro-stage {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(18, 0, 3, 0.25) 0%, rgba(0, 0, 0, 0.98) 75%);
            pointer-events: none;
        }

        .keynote-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            max-width: 1200px;
            width: 100%;
        }

        /* 1. Central White SVG Emblem */
        .scp-mark-wrap {
            width: 116px;
            height: 116px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform-origin: center center;
            will-change: transform, opacity, filter;
        }

        .scp-svg-pure {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 2. Wordmark Typography */
        .wordmark-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 2.2vw, 30px);
            font-size: clamp(28px, 4.6vw, 56px);
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            line-height: 1.1;
            user-select: none;
            flex-wrap: nowrap;
        }

        .word-segment {
            display: inline-flex;
            align-items: center;
        }

        .char-span {
            display: inline-block;
            will-change: transform, opacity, filter;
            transform-origin: center center;
        }

        .word-secret .char-span,
        .word-protocols .char-span {
            color: #FF1A2A;
        }

        .word-corporation .char-span {
            color: #FFFFFF;
        }

        /* 3. Minimalist Clearance Subtitle */
        .sub-clearance {
            margin-top: 36px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(11px, 1.1vw, 13px);
            letter-spacing: 0.22em;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(8px);
            will-change: opacity, transform;
        }

        .sub-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FF1A2A;
            box-shadow: 0 0 10px #FF1A2A, 0 0 20px #FF1A2A;
            animation: redPulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes redPulse {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 18px #FF1A2A, 0 0 30px #FF1A2A; }
        }

        /* 4. Bottom Controls */
        .bottom-nav {
            position: absolute;
            bottom: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
            opacity: 0;
            will-change: opacity;
        }

        .btn-keynote {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            color: #d4d4d8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 9999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn-keynote:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-keynote.accent {
            background: rgba(255, 26, 42, 0.2);
            border-color: #FF1A2A;
            color: #ffffff;
        }

        .btn-keynote.accent:hover {
            background: #FF1A2A;
            box-shadow: 0 0 25px rgba(255, 26, 42, 0.6);
        }
    </style>
</head>
<body>

    <div class="intro-stage" id="intro-stage">
        <div class="bg-vignette"></div>

        <main class="keynote-container">
            <!-- 1. Central White SVG Emblem -->
            <div class="scp-mark-wrap" id="scp-mark-wrap">
                <svg viewBox="0 0 447 447" class="scp-svg-pure">
                    <g transform="translate(0.000000,447.000000) scale(0.100000,-0.100000)" fill="#ffffff" stroke="none">
                        <path d="M1636 4238 c-4 -24 -16 -98 -28 -166 l-21 -123 -131 -64 c-455 -220 -790 -600 -949 -1076 -20 -58 -43 -143 -52 -190 -9 -46 -21 -104 -26 -129 -16 -68 -22 -324 -11 -425 l10 -90 -81 -75 c-45 -41 -104 -95 -130 -120 l-49 -45 214 -370 c118 -204 252 -436 299 -517 46 -81 88 -148 93 -148 5 0 78 25 161 56 l152 55 79 -56 c183 -132 382 -226 594 -283 192 -52 234 -57 480 -57 205 0 250 3 348 23 245 50 478 146 673 277 61 41 115 75 120 75 6 0 83 -23 172 -51 89 -27 163 -47 164 -42 2 4 96 168 209 363 113 195 246 426 296 513 l91 159 -26 21 c-15 12 -74 60 -131 107 l-105 85 7 40 c4 22 7 139 6 260 -1 199 -3 232 -28 348 -122 580 -492 1052 -1018 1297 l-96 45 -27 120 c-15 66 -32 144 -38 173 l-10 52 -602 0 -602 0 -7 -42z m1132 -148 c12 -52 30 -126 40 -163 l17 -68 100 -43 c287 -124 519 -308 703 -559 272 -369 382 -806 321 -1276 -7 -50 -8 -86 -2 -90 32 -22 233 -194 233 -199 0 -4 -9 -22 -20 -40 -12 -19 -122 -210 -247 -425 -124 -216 -227 -395 -229 -399 -4 -5 -69 13 -276 78 l-48 14 -62 -48 c-213 -166 -462 -276 -753 -334 -92 -19 -143 -22 -310 -22 -177 1 -214 4 -323 27 -277 59 -501 161 -724 329 -42 32 -80 58 -85 58 -4 0 -72 -23 -151 -52 -85 -31 -146 -48 -151 -42 -5 5 -120 200 -255 434 l-247 425 122 116 122 116 -12 77 c-16 108 -14 347 4 469 76 512 365 956 796 1224 82 51 228 124 296 148 29 11 55 26 57 34 3 9 15 77 27 151 12 74 27 141 32 148 8 9 116 12 506 10 l496 -3 23 -95z"/>
                        <path d="M2170 3535 l0 -95 -35 0 c-50 0 -217 -37 -300 -67 -345 -124 -619 -403 -738 -753 -89 -261 -82 -573 19 -819 20 -47 37 -95 37 -105 2 -15 -18 -31 -73 -63 -41 -24 -81 -47 -89 -52 -11 -6 -7 -20 20 -69 19 -34 37 -62 41 -62 3 0 46 23 94 50 48 28 90 49 94 48 4 -2 36 -38 71 -82 152 -190 381 -335 636 -403 131 -35 373 -44 508 -18 324 60 578 225 791 514 2 2 44 -20 94 -49 103 -59 97 -60 143 21 31 54 36 46 -79 113 l-82 46 34 78 c104 241 122 540 49 797 -137 478 -558 827 -1059 877 l-29 3 2 93 2 92 -75 0 -76 0 0 -95z m0 -530 l0 -215 -86 0 -86 0 123 -237 c67 -131 123 -239 124 -241 2 -2 33 56 70 130 37 73 92 179 121 235 30 55 54 104 54 107 0 3 -38 6 -85 6 l-84 0 -3 216 -3 216 57 -6 c402 -46 755 -374 839 -781 23 -112 25 -274 3 -386 -15 -79 -67 -234 -82 -243 -6 -3 -334 183 -349 197 -2 2 14 35 36 73 22 38 39 70 37 71 -4 5 -520 31 -525 27 -3 -3 279 -444 285 -444 2 0 22 31 44 70 22 38 45 70 50 70 19 0 340 -194 340 -205 0 -7 -39 -53 -86 -104 -172 -182 -375 -282 -632 -311 -312 -35 -661 111 -854 357 l-47 60 42 23 c23 13 102 59 176 102 74 43 135 77 136 76 1 -2 20 -33 41 -70 21 -38 41 -68 44 -68 4 0 210 315 273 419 l17 29 -42 -4 c-24 -2 -142 -9 -263 -14 -121 -6 -221 -13 -224 -15 -2 -2 15 -36 39 -75 23 -40 40 -73 38 -74 -15 -13 -339 -196 -346 -196 -5 0 -19 21 -30 48 -65 154 -91 330 -72 493 50 432 356 771 780 863 36 8 80 14 98 15 l32 1 0 -215z"/>
                    </g>
                </svg>
            </div>

            <!-- 2. Wordmark with Per-Character Chromatic Spans -->
            <div class="wordmark-row" id="wordmark-row">
                <div class="word-segment word-secret" id="word-secret"></div>
                <div class="word-segment word-corporation" id="word-corporation"></div>
                <div class="word-segment word-protocols" id="word-protocols"></div>
            </div>

            <!-- 3. Minimalist Clearance Subtitle -->
            <div class="sub-clearance" id="sub-clearance">
                <span class="sub-dot"></span>
                <span>SECURE · CONTAIN · PROTECT // PROTOCOL IDENTIFIER</span>
            </div>
        </main>

        <!-- 4. Interactive Bottom Controls -->
        <footer class="bottom-nav" id="bottom-nav">
            <button class="btn-keynote" onclick="replayKeynote()">Replay Sequence</button>
            <a href="login.html" class="btn-keynote accent">Enter Website ➔</a>
        </footer>
    </div>

    <script>
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const lerp = (a, b, t) => a + (b - a) * t;
        const seg = (t, a, b) => clamp((t - a) / (b - a || 1e-6), 0, 1);
        const smooth = (t) => t * t * (3 - 2 * t);
        const eOut = (t) => 1 - Math.pow(1 - t, 3);

        function createRng(seed) {
          let a = seed >>> 0;
          return function () {
            a += 0x6d2b79f5;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        let keynoteAnimFrame = null;
        let keynoteStartTime = null;
        let isKeynoteActive = true;
        let letterDataList = [];

        function setupKeynoteDOM() {
            const rng = createRng(104729);
            const words = [
                { id: 'word-secret', text: 'SECRET', isRed: true },
                { id: 'word-corporation', text: 'CORPORATION', isRed: false },
                { id: 'word-protocols', text: 'PROTOCOLS', isRed: true }
            ];

            letterDataList = [];

            words.forEach(w => {
                const container = document.getElementById(w.id);
                if (!container) return;
                container.innerHTML = '';
                for (let i = 0; i < w.text.length; i++) {
                    const ch = w.text[i];
                    const span = document.createElement('span');
                    span.className = 'char-span';
                    span.innerText = ch;
                    container.appendChild(span);

                    letterDataList.push({
                        el: span,
                        jx: (rng() - 0.5) * 2,
                        jy: (rng() - 0.5) * 2,
                        delay: rng() * 0.8,
                        isRed: w.isRed
                    });
                }
            });
        }

        function runKeynoteSequence() {
            setupKeynoteDOM();

            const markWrap = document.getElementById('scp-mark-wrap');
            const subClearance = document.getElementById('sub-clearance');
            const bottomNav = document.getElementById('bottom-nav');

            if (keynoteAnimFrame) cancelAnimationFrame(keynoteAnimFrame);
            isKeynoteActive = true;
            keynoteStartTime = performance.now();

            const totalDuration = 2200; // 2.2s sequence

            function tick(now) {
                if (!isKeynoteActive) return;
                const elapsed = now - keynoteStartTime;
                const progress = clamp(elapsed / totalDuration, 0, 1);

                // --- Phase 1: Emblem Scaling & Convergence (0.20s – 0.58s) ---
                if (markWrap) {
                    const emblemScale = lerp(0.55, 1.0, eOut(seg(progress, 0.20, 0.58)));
                    const emblemOpacity = smooth(seg(progress, 0.20, 0.52));
                    const emblemSep = (1 - eOut(seg(progress, 0.20, 0.58))) * 12;

                    markWrap.style.opacity = emblemOpacity;
                    markWrap.style.transform = `scale(${emblemScale})`;

                    if (emblemSep > 0.4) {
                        markWrap.style.filter = `drop-shadow(-${emblemSep}px 0 rgba(255, 30, 45, 0.7)) drop-shadow(${emblemSep}px 0 rgba(45, 255, 200, 0.6))`;
                    } else {
                        markWrap.style.filter = `drop-shadow(0 0 25px rgba(255, 255, 255, 0.4))`;
                    }
                }

                // --- Phase 2: Letter-by-Letter Chromatic Assembly (0.04s – 0.65s) ---
                for (let i = 0; i < letterDataList.length; i++) {
                    const item = letterDataList[i];
                    const a = eOut(clamp(seg(progress, 0.04, 0.52) * 1.5 - item.delay * 0.45, 0, 1));
                    const transX = item.jx * 64 * (1 - a);
                    const transY = item.jy * 36 * (1 - a);
                    const scale = lerp(1.24, 1.0, a);
                    const opacity = Math.min(1, a * 1.6);
                    const sep = (1 - a) * 11;

                    item.el.style.opacity = opacity;
                    item.el.style.transform = `translate(${transX}px, ${transY}px) scale(${scale})`;

                    if (sep > 0.4) {
                        if (item.isRed) {
                            item.el.style.textShadow = `${-1 * sep}px 0 rgba(255, 30, 45, 0.95), ${1 * sep}px 0 rgba(255, 140, 150, 0.65), 0 ${0.55 * sep}px rgba(180, 0, 20, 0.85)`;
                        } else {
                            item.el.style.textShadow = `${-1 * sep}px 0 rgba(255, 64, 72, 0.85), ${1 * sep}px 0 rgba(64, 255, 190, 0.80), 0 ${0.55 * sep}px rgba(96, 124, 255, 0.80)`;
                        }
                        item.el.style.filter = `blur(${sep * 0.28}px)`;
                    } else {
                        item.el.style.textShadow = 'none';
                        item.el.style.filter = 'none';
                    }
                }

                // --- Phase 3: Reveal Subtitle & Interactive HUD (0.55s – 1.0s) ---
                if (subClearance) {
                    const subOpacity = smooth(seg(progress, 0.55, 0.85));
                    subClearance.style.opacity = subOpacity;
                    subClearance.style.transform = `translateY(${lerp(8, 0, subOpacity)}px)`;
                }

                if (bottomNav) {
                    const hudOpacity = smooth(seg(progress, 0.72, 0.96));
                    bottomNav.style.opacity = hudOpacity;
                }

                if (progress < 1.0) {
                    keynoteAnimFrame = requestAnimationFrame(tick);
                }
            }

            keynoteAnimFrame = requestAnimationFrame(tick);
        }

        function replayKeynote() {
            runKeynoteSequence();
        }

        document.addEventListener('DOMContentLoaded', runKeynoteSequence);
    </script>
</body>
</html>
